services:
  ai-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local_ai_assistant
    restart: unless-stopped
    # CRITICAL: Mount host models directory directly into container.
    # Changing requirements or Dockerfile will NEVER trigger a re-download of model files.
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs:rw
    environment:
      - ASSISTANT_ENV=production
      - MODEL_PATH=/app/models/Qwen3-1.7B-Q4_K_M.gguf
      - LLAMA_SERVER_HOST=127.0.0.1
      - LLAMA_SERVER_PORT=8080
      - MAX_CONTEXT_TOKENS=2048
      - MAX_OUTPUT_TOKENS=512
      - CPU_THREADS=4
      - GPU_LAYERS=24
      - LOG_LEVEL=INFO
    # Bounded local networking
    network_mode: "bridge"
